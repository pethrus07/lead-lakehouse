services:
  db:
    image: postgres:16-alpine
    container_name: llh-postgres
    environment:
      POSTGRES_USER: llh
      POSTGRES_PASSWORD: llh
      POSTGRES_DB: leadlakehouse
    ports:
      - "5433:5432"   # 5433 no host p/ não colidir com Postgres do zapagente
    volumes:
      - llh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llh -d leadlakehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  llh_pgdata:
