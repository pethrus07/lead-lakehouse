[project]
name = "lead-lakehouse"
version = "1.0.0-dev"
description = "Motor de prospecção multi-fonte: descobre negócios, pontua oportunidade e entrega leads para o zapagente."
authors = [{ name = "Pedro Oliveira" }]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
# Fontes/enriquecimento que usam browser/parsing — instaladas quando entrarmos na F1.
scraping = [
    "playwright>=1.44",
    "selectolax>=0.3",
]
# Interface visual — reaproveita o Streamlit atual.
ui = [
    "streamlit>=1.35",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
llh = "leadlakehouse.interface.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leadlakehouse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
